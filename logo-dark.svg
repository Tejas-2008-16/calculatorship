<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 52" fill="none">
  <defs>
    <linearGradient id="iconGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D09C"/>
      <stop offset="100%" stop-color="#00875A"/>
    </linearGradient>
  </defs>

  <!-- Icon: Rounded square with emerald gradient + white bar chart -->
  <rect x="0" y="4" width="44" height="44" rx="12" fill="url(#iconGradDark)"/>
  <rect x="9"  y="32" width="7" height="10" rx="2" fill="#FFFFFF" opacity="0.75"/>
  <rect x="19" y="25" width="7" height="17" rx="2" fill="#FFFFFF" opacity="0.88"/>
  <rect x="29" y="16" width="7" height="26" rx="2" fill="#FFFFFF"/>

  <!-- Wordmark: white + emerald -->
  <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="23" letter-spacing="-0.5">
    <tspan x="54" y="32" fill="#FFFFFF">Calculator</tspan><tspan fill="#00D09C">ship</tspan>
  </text>

  <!-- Tagline -->
  <text x="54" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" letter-spacing="1.8">SMART FINANCIAL TOOLS</text>
</svg>